<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="Architecture diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="900" height="560" rx="24" fill="url(#bg)"/>
  <text x="64" y="96" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="700">Lazy renderer architecture</text>
  <text x="64" y="130" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="16">One shell, one toolbar, many tiny chunks.</text>
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="64" y="178" width="220" height="118" rx="16" fill="#111a30" stroke="#334155"/>
    <text x="88" y="216" fill="#e2e8f0" font-size="18" font-weight="600">WuFileViewer</text>
    <text x="88" y="242" fill="#94a3b8" font-size="13">source · theme · i18n</text>
    <text x="88" y="264" fill="#94a3b8" font-size="13">toolbar · slots · events</text>
    <rect x="340" y="178" width="220" height="118" rx="16" fill="#111a30" stroke="#334155"/>
    <text x="364" y="216" fill="#e2e8f0" font-size="18" font-weight="600">Registry</text>
    <text x="364" y="242" fill="#94a3b8" font-size="13">detect format</text>
    <text x="364" y="264" fill="#94a3b8" font-size="13">load on demand</text>
    <rect x="616" y="178" width="220" height="118" rx="16" fill="#111a30" stroke="#334155"/>
    <text x="640" y="216" fill="#e2e8f0" font-size="18" font-weight="600">Renderer chunks</text>
    <text x="640" y="242" fill="#94a3b8" font-size="13">image / pdf / office</text>
    <text x="640" y="264" fill="#94a3b8" font-size="13">text / archive / epub</text>
    <path d="M284 237h40" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <path d="M560 237h40" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <g fill="#1e293b" stroke="#334155">
      <rect x="64" y="352" width="156" height="56" rx="12"/>
      <rect x="236" y="352" width="156" height="56" rx="12"/>
      <rect x="408" y="352" width="156" height="56" rx="12"/>
      <rect x="580" y="352" width="156" height="56" rx="12"/>
      <rect x="752" y="352" width="84" height="56" rx="12"/>
    </g>
    <g fill="#cbd5e1" font-size="14" text-anchor="middle">
      <text x="142" y="385">Office</text>
      <text x="314" y="385">PDF</text>
      <text x="486" y="385">Media</text>
      <text x="658" y="385">Code</text>
      <text x="794" y="385">EPUB</text>
    </g>
    <text x="64" y="486" fill="#64748b" font-size="13">Each chunk is emitted only when its format is opened for the first time.</text>
  </g>
</svg>
