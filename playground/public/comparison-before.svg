      <path d="M104 24h16m0 0-6-6m6 6-6 6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(470 220)">
      <rect width="186" height="118" rx="20" fill="#eef2ff"/>
      <circle cx="38" cy="38" r="15" fill="#6366f1"/>
      <circle cx="76" cy="38" r="15" fill="#38bdf8"/>
