    <circle cx="52" cy="51" r="24" fill="#292524"/>
    <path d="m43 51 6 6 12-13" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="92" y="45" fill="#fff7ed" font-family="Inter, sans-serif" font-size="16" font-weight="700">Delivered</text>
    <text x="92" y="67" fill="#a8a29e" font-family="Inter, sans-serif" font-size="12">Production ready</text>
