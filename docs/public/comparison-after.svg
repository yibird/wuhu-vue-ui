<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="0.5" stop-color="#ffedd5"/>
      <stop offset="1" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e11d48"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#7c2d12" flood-opacity="0.18"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ea580c" opacity="0.2"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#dots)"/>
  <circle cx="985" cy="145" r="190" fill="#fbbf24" opacity="0.34"/>
  <circle cx="1030" cy="590" r="240" fill="#fb7185" opacity="0.24"/>
  <circle cx="120" cy="660" r="170" fill="#fdba74" opacity="0.5"/>

  <g filter="url(#shadow)">
    <rect x="110" y="112" width="610" height="526" rx="34" fill="#1c1917"/>
  </g>

  <g font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="166" y="202" fill="#fb923c" font-size="17" font-weight="700" letter-spacing="4">BUILT / 02</text>
    <text x="160" y="310" fill="#fff7ed" font-size="82" font-weight="800" letter-spacing="-4">Made</text>
    <text x="160" y="396" fill="#fff7ed" font-size="82" font-weight="800" letter-spacing="-4">to last.</text>
    <text x="166" y="454" fill="#a8a29e" font-size="21">The same idea, brought to production.</text>

    <g transform="translate(166 510)">
      <rect width="164" height="48" rx="24" fill="url(#accent)"/>
      <text x="36" y="30" fill="#ffffff" font-size="16" font-weight="700">View live</text>
      <path d="M116 24h16m0 0-6-6m6 6-6 6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(470 220)">
      <rect width="186" height="118" rx="20" fill="#292524"/>
      <circle cx="38" cy="38" r="15" fill="#fb7185"/>
      <circle cx="76" cy="38" r="15" fill="#fb923c"/>
      <circle cx="114" cy="38" r="15" fill="#2dd4bf"/>
      <rect x="26" y="74" width="132" height="8" rx="4" fill="#44403c"/>
      <rect x="26" y="90" width="86" height="8" rx="4" fill="#57534e"/>
    </g>

    <g transform="translate(470 372)">
      <rect width="186" height="88" rx="18" fill="#fff7ed"/>
      <text x="22" y="36" fill="#a8a29e" font-size="11" letter-spacing="2">PROGRESS</text>
      <text x="22" y="65" fill="#1c1917" font-size="25" font-weight="700">100%</text>
      <rect x="92" y="48" width="70" height="7" rx="3.5" fill="#fed7aa"/>
      <rect x="92" y="48" width="70" height="7" rx="3.5" fill="url(#cool)"/>
    </g>
  </g>

  <g transform="translate(790 170) rotate(-6)" filter="url(#shadow)">
    <rect width="300" height="360" rx="32" fill="#fffbf7"/>
    <rect x="28" y="28" width="244" height="158" rx="22" fill="url(#cool)"/>
    <circle cx="178" cy="102" r="46" fill="#ffffff" opacity="0.2"/>
    <circle cx="142" cy="82" r="18" fill="#ffffff" opacity="0.45"/>
    <path d="M60 138c28-14 52 10 80-6s46 4 72-10" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.55"/>
    <rect x="28" y="212" width="180" height="13" rx="6.5" fill="#fed7aa"/>
    <rect x="28" y="238" width="126" height="13" rx="6.5" fill="#ffedd5"/>
    <g transform="translate(28 280)">
