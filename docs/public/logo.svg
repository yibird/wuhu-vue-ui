<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Wuhu Vue UI">
  <defs>
    <linearGradient id="wuhu-w-gradient" x1="27" y1="37" x2="101" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" />
      <stop offset="0.18" stop-color="#3b82f6" />
      <stop offset="0.42" stop-color="#5a54f9" />
      <stop offset="0.62" stop-color="#7c6ffb" />
      <stop offset="0.8" stop-color="#c084fc" />
      <stop offset="0.92" stop-color="#f472b6" />
      <stop offset="1" stop-color="#ff6b3d" />
    </linearGradient>
    <radialGradient id="wuhu-w-glow" cx="50%" cy="48%" r="52%">
      <stop stop-color="#5a54f9" stop-opacity="0.22" />
      <stop offset="1" stop-color="#5a54f9" stop-opacity="0" />
    </radialGradient>
    <filter id="wuhu-w-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#3b35d4" flood-opacity="0.2" />
    </filter>
    <filter id="wuhu-w-neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <circle cx="64" cy="62" r="44" fill="url(#wuhu-w-glow)" />

  <g filter="url(#wuhu-w-shadow)">
    <path
      d="M27 37 45 92 64 55 83 92 101 37"
      fill="none"
      stroke="#3f39cc"
      stroke-width="13"
      stroke-linecap="round"
      stroke-linejoin="round"
      transform="translate(2.5 3.5)"
    />
    <g filter="url(#wuhu-w-neon)">
      <path
        d="M27 37 45 92 64 55 83 92 101 37"
        fill="none"
        stroke="url(#wuhu-w-gradient)"
        stroke-width="13"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </g>
  </g>
